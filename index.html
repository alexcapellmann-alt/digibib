<meta charset="utf-8">
<title>DigiBib · Stöbern</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky level bar (breadcrumb = the four levels), one wide stage below that swaps per level */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --sunk:#eef1f5; --fg:#14171c; --fg2:#4a505a; --muted:#7a808a; --rule:#dfe2e7; --grid:#eceef1;
  --accent:#2a78d6; --hl:rgba(42,120,214,.10);
  --s0:#2a78d6; --s1:#eb6834; --s2:#1baf7a; --s3:#eda100; --s4:#e87ba4; --s5:#008300;
  --c0:#2a78d6; --c1:#eb6834; --c2:#1baf7a; --c3:#7a5bd0; --c4:#eda100; --c5:#0094a8; --c6:#d63a4f; --c7:#6f8f1f; --c8:#c05fc0; --c9:#a8642a; --c10:#3f5fa8; --c11:#e87ba4; --gray:#a3a8b0;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Inter","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1a1d21; --sunk:#16191d; --fg:#eef0f3; --fg2:#b9bec6; --muted:#8a9099; --rule:#2c3036; --grid:#24282d;
  --accent:#5598e7; --hl:rgba(85,152,231,.14);
  --s0:#3987e5; --s1:#d95926; --s2:#199e70; --s3:#c98500; --s4:#d55181; --s5:#0ca30c;
  --c0:#3987e5; --c1:#d95926; --c2:#199e70; --c3:#8f74e0; --c4:#c98500; --c5:#12a6ba; --c6:#e0566a; --c7:#7a9a30; --c8:#b865b8; --c9:#b97a43; --c10:#6c86d0; --c11:#d55181; --gray:#61666e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1a1d21; --sunk:#16191d; --fg:#eef0f3; --fg2:#b9bec6; --muted:#8a9099; --rule:#2c3036; --grid:#24282d;
  --accent:#5598e7; --hl:rgba(85,152,231,.14);
  --s0:#3987e5; --s1:#d95926; --s2:#199e70; --s3:#c98500; --s4:#d55181; --s5:#0ca30c;
  --c0:#3987e5; --c1:#d95926; --c2:#199e70; --c3:#8f74e0; --c4:#c98500; --c5:#12a6ba; --c6:#e0566a; --c7:#7a9a30; --c8:#b865b8; --c9:#b97a43; --c10:#6c86d0; --c11:#d55181; --gray:#61666e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--body);margin:0}
.in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
/* level bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--rule)}
.bar .in{display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:wrap;padding-block:8px}
.brand{font:700 15px/1.2 var(--display);white-space:nowrap}
.brand small{display:block;font:500 11px/1.2 var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0;flex:1}
.crumb{border:none;background:none;padding:6px 10px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--fg2);font-size:13.5px;max-width:280px}
.crumb span.lv{font:500 10.5px/1 var(--mono);color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:3px 6px;flex:none}
.crumb .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb:hover{background:var(--sunk)}
.crumb.on{background:var(--hl);color:var(--fg);font-weight:600}
.crumb.on span.lv{border-color:var(--accent);color:var(--accent)}
.crumb[disabled]{opacity:.4;cursor:default;background:none}
.sep{color:var(--muted)}
.tag{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stage{padding-block:28px 72px}
.row{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between}
.lede{color:var(--fg2);max-width:70ch;font-size:16px}
.draft{border-left:3px solid var(--accent);background:var(--surface);padding:12px 16px;border-radius:0 8px 8px 0;max-width:72ch;color:var(--fg2)}
.draft .tag{display:block;margin-bottom:6px;color:var(--accent)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--fg2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:18px}
.scroll{overflow-x:auto}
svg text{font-family:var(--body)}
.lscape{display:block;width:100%;min-width:760px}
.lscape .ax{fill:var(--muted);font:11px var(--mono)}
.lscape .bl{fill:var(--fg);font-size:12.5px;font-weight:600}
.lscape .bn{fill:var(--muted);font:11px var(--mono)}
.pill{cursor:pointer}
.pill rect{fill:var(--surface);stroke:var(--fg2);stroke-width:1}
.pill text{fill:var(--fg);font-size:12px;font-weight:600}
.pill:hover rect,.pill:focus rect{fill:var(--fg);stroke:var(--fg)}
.pill:hover text,.pill:focus text{fill:var(--bg)}
.pill:focus{outline:none}
.sp-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.spc{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.spc:hover{border-color:var(--fg2)}
.spc:focus-visible{outline:2px solid var(--accent)}
.spc h3{font-size:16px}
.spc .m{font-size:12.5px;color:var(--muted)}
.dots{display:flex;gap:4px}
.lab{display:inline-flex;align-items:center;gap:5px;margin-right:12px;white-space:nowrap}
.labs{display:flex;flex-wrap:wrap;row-gap:2px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--sunk);border:1px solid var(--rule);border-radius:999px;padding:3px}
.seg button{border:none;background:none;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--fg2);cursor:pointer}
.seg button .num{color:var(--muted);font-size:11.5px;margin-left:2px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 0 0 1px var(--rule)}
/* groups */
.groups{display:flex;flex-direction:column;gap:2px}
.grp{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1.3fr) 2fr 64px;gap:16px;align-items:center;padding:9px 12px;border-radius:8px}
.grp:hover,.grp:focus-visible{background:var(--sunk)}
.grp .l{font-weight:500;overflow-wrap:anywhere}
.grp .tl{position:relative;height:14px}
.grp .tl i{position:absolute;top:3px;height:8px;border-radius:4px}
.grp .tl b{position:absolute;inset:6px 0 auto;height:1px;background:var(--grid)}
.grp .n{text-align:right;font-family:var(--mono);font-size:13px;color:var(--fg2)}
.axis-row{display:grid;grid-template-columns:minmax(0,1.3fr) 2fr 64px;gap:16px;padding:0 12px;font:11px var(--mono);color:var(--muted)}
.axis-row div:nth-child(2){display:flex;justify-content:space-between}
@media (max-width:620px){.grp,.axis-row{grid-template-columns:1fr 56px}.grp .tl,.axis-row div:nth-child(2){grid-column:1/-1;grid-row:2}.axis-row div:first-child{display:none}}
/* objects */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.oc{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.oc:hover{border-color:var(--fg2)}
.oc:focus-visible{outline:2px solid var(--accent)}
.oc .ph{aspect-ratio:4/3;max-width:100%;background:var(--sunk);position:relative;display:flex;align-items:flex-end;padding:10px;border-bottom:3px solid var(--c)}
.oc .ph .art{font:500 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--fg2)}
.oc .ph .yr{position:absolute;top:10px;right:12px;font:700 26px/1 var(--display);color:var(--fg2);opacity:.55}
.oc .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.oc .tt{font-weight:600;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.oc .pp{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oc.mini .ph{aspect-ratio:auto;height:54px}
.oc.mini .ph .yr{font-size:18px;top:8px}
/* object detail */
.detail{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:28px}
@media (max-width:860px){.detail{grid-template-columns:1fr}}
.viewer{aspect-ratio:3/4;max-width:100%;background:var(--sunk);border-radius:10px;border:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;color:var(--muted);border-top:4px solid var(--c)}
.viewer .big{font:700 44px/1 var(--display);color:var(--fg2)}
.viewer a{color:var(--accent);font-weight:600}
dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 14px;margin:0;font-size:14px}
dt{color:var(--muted)}
dd{margin:0;overflow-wrap:anywhere}
.xl{display:flex;flex-direction:column;gap:14px}
.xbox{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.xbox h3{font-size:15px}
.counts{display:flex;flex-wrap:wrap;gap:6px}
.cnt{font-size:12.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--rule);display:inline-flex;gap:6px;align-items:center;color:var(--fg2)}
.cnt b{font-family:var(--mono);font-weight:500;color:var(--fg)}
.cards.x{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.note{font-size:12.5px;color:var(--muted)}
.net text{font-size:11.5px;fill:var(--fg2)}
.net .node{cursor:pointer}
.net .edge,.net .spoke,.net .node{transition:opacity .15s}
.net.focus .edge,.net.focus .spoke{opacity:.06}
.net.focus .node{opacity:.3}
.net.focus .edge.hi{opacity:1;stroke-opacity:.95}
.net.focus .spoke.hi{opacity:1;stroke-opacity:.7}
.net.focus .node.hi{opacity:1}
.net.focus .node.partner text{fill:var(--s1);font-weight:600}
.net .ncenter{cursor:pointer}
.net .ncenter:focus{outline:none}
.net .node:hover circle,.net .node:focus circle{stroke:var(--fg);stroke-width:2}
.net .node:focus{outline:none}
.net .node:hover text,.net .node:focus text{fill:var(--fg);font-weight:600}
#tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);font:500 12.5px/1.4 var(--body);padding:7px 10px;border-radius:6px;opacity:0;z-index:20;max-width:280px}
.loading{padding:60px 0;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:18px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.facts{display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--fg2)}
.facts b{font:500 22px/1.1 var(--mono);color:var(--fg);display:block}
a{color:var(--accent)}


/* Schwerpunkt-Ansichten */
.oc.tile{border-radius:4px;border:none;aspect-ratio:3/4}
.oc.tile .ph{aspect-ratio:auto;height:100%;padding:0;border-bottom:none;background-color:color-mix(in srgb,var(--c) 22%,var(--sunk))}
.oc.tile:hover{outline:2px solid var(--fg)}
.oc.tile .ph.img::before{display:none}
.wall{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:14px;overflow-x:auto}
.wcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:3px}
.frow{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-top:1px solid var(--rule)}
.frow h2{font-size:20px}
.fflow{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.fst{flex:1 1 200px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.fh{display:flex;justify-content:space-between;gap:8px}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.farr{align-self:center;font:500 22px/1 var(--display);color:var(--muted)}
.fhist{display:flex;align-items:flex-end;gap:2px;height:40px}
.fhist i{flex:1;background:var(--c2);border-radius:2px 2px 0 0;min-height:1px}
.ldot{cursor:pointer}
.ldot:hover{fill-opacity:1;stroke:var(--fg);stroke-width:1.5}
.fam{cursor:pointer}
.fam:hover circle,.fam:focus circle{stroke:var(--fg);stroke-width:2}
.fam:focus{outline:none}
.arc{cursor:pointer}
.arc:hover{stroke-opacity:1}
.cal{display:grid;grid-template-columns:40px repeat(31,minmax(24px,1fr));gap:3px;min-width:820px}
.cal .cd,.cal .cm{font:11px var(--mono);color:var(--muted);text-align:center;align-self:center}
.cal .cm{text-align:left}
.cday{border:none;aspect-ratio:1;border-radius:3px;cursor:pointer;padding:0;position:relative;overflow:hidden;background-color:var(--sunk);background-repeat:no-repeat}
.cday i{position:absolute;left:0;bottom:0;height:3px;background:var(--c0)}
.cday.img i{box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.cday:hover{outline:2px solid var(--fg)}
.cday.today{outline:2px solid var(--c1);outline-offset:1px}
.tour{display:flex;flex-direction:column}
.stn{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;padding:22px 0;border-top:1px solid var(--rule)}
.stl{position:sticky;top:80px;align-self:start;display:flex;flex-direction:column;gap:4px}
.stl b{font:600 17px/1.2 var(--display)}
.stb{display:flex;flex-direction:column;gap:10px}
.stb h2{font-size:22px}
.stb>p:first-of-type{max-width:68ch;font-size:15.5px}
@media (max-width:700px){.stn{grid-template-columns:1fr;gap:8px}.stl{position:static}}

:root{--wall:#d6d0c4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--wall:#45413a}}
:root[data-theme="dark"]{--wall:#45413a}
.radwrap{position:relative;padding:8px}
#rad{display:block;width:100%;max-width:980px;margin:0 auto;touch-action:none;cursor:grab}
.radtools{position:absolute;top:12px;right:12px;display:flex;gap:6px}
.radtools .more{padding:6px 12px}
/* IIIF */
.oc .ph{background-color:var(--sunk);background-size:cover;background-position:center top}
.oc .ph.img::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,0) 55%)}
.oc .ph.img .art,.oc .ph.img .yr{position:relative;color:#fff;opacity:1;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.oc .ph.img .yr{position:absolute}
.vwrap{display:flex;flex-direction:column;gap:6px}
.viewer.osd{display:block;padding:0;aspect-ratio:3/4;background:#111}
.vbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13.5px}
.vbar a{font-weight:600}
a.more{text-decoration:none;color:var(--fg);font-size:13.5px}
.plink{color:var(--accent)}
.por{object-fit:cover;object-position:center 20%;border-radius:50%;background:var(--sunk);flex:none;vertical-align:middle}
.por.l{width:88px;height:88px}
.por.s{width:32px;height:32px;margin-right:8px}
.por.xs{width:18px;height:18px;margin-right:6px}
.ph3{display:flex;align-items:center}
.groups2{display:flex;flex-direction:column}
.grp2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr) 126px;gap:16px;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;border-top:1px solid var(--grid)}
.grp2:first-child{border-top:none}
.grp2:hover,.grp2:focus-visible{background:var(--sunk);outline:none}
.grp2 .gl{display:flex;flex-direction:column;gap:2px;min-width:0}
.grp2 .gl b{font-weight:600;overflow-wrap:anywhere}
.gb{position:relative}
.gband{display:block;width:100%;height:38px}
.gout{position:absolute;right:0;bottom:-4px;font:10.5px var(--mono);color:var(--muted)}
.gt{display:grid;grid-template-columns:repeat(3,38px);gap:4px;justify-content:end}
.gt .oc.tile{cursor:pointer}
.gaxis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr) 126px;gap:16px;padding:0 12px 6px}
.gax{position:relative;height:14px;font:11px var(--mono);color:var(--muted)}
.gax span{position:absolute;transform:translateX(-50%)}
@media (max-width:700px){.grp2,.gaxis{grid-template-columns:1fr 126px}.grp2 .gb{grid-column:1/-1;grid-row:2}.gaxis .gax{display:none}}
.pstrip{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.pst{display:flex;gap:14px;overflow-x:auto;padding-bottom:4px}
.pk{display:flex;flex-direction:column;align-items:center;gap:4px;width:74px;flex:none;text-decoration:none;color:var(--fg);text-align:center}
.pk span{font-size:11.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pk small{font:11px var(--mono);color:var(--muted)}
.pk:hover span{text-decoration:underline}
.por.k{width:52px;height:52px}
.faces{display:flex;margin-bottom:2px}
.faces .por{width:30px;height:30px;border:2px solid var(--surface);margin-right:-8px}
.fhgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);gap:20px;align-items:start}
@media (max-width:820px){.fhgrid{grid-template-columns:1fr}}
.fhlist{display:flex;flex-direction:column;gap:10px}
.fhl{display:flex;flex-direction:column;gap:4px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.fhn{all:unset;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.fhn b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--c3) 60%,var(--surface));font:700 11.5px var(--body);flex:none}
.fhn span:nth-child(2){font-weight:600;flex:1}
.fhn:hover span:nth-child(2){text-decoration:underline}
.fhp{display:flex;flex-wrap:wrap;gap:5px;padding-left:32px}
.por.m2{width:30px;height:30px}
.por.m{width:26px;height:26px}
.por.l2{width:60px;height:60px}
.fhead{display:flex;gap:14px;align-items:center}
.fhead b{display:block;font:600 17px var(--display)}
.fppl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.fp{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--fg);font-size:13px}
.fp small{color:var(--muted);margin-left:4px}
.fp:hover span{text-decoration:underline}
/* Ebene "alle Objekte einer Zeile" */
.rowlink{cursor:pointer}
.rowlink:hover .bl,.rowlink:focus .bl{text-decoration:underline}
.rowlink:focus{outline:none}
.lscape .hov{cursor:pointer}
.hist{display:flex;align-items:flex-end;gap:2px;height:96px}
.hist button{flex:1;min-width:3px;border:none;padding:0;background:none;opacity:.9;border-radius:2px 2px 0 0;cursor:pointer;display:flex;flex-direction:column-reverse;overflow:hidden}
.hist button i{display:block;width:100%;flex:none}
.hleg{margin-top:10px;gap:4px 14px;font-size:12.5px}
.lgb{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;border:1px solid transparent}
.lgb:hover{border-color:var(--rule)}
.lgb:focus-visible{outline:2px solid var(--accent)}
.lgb.on{border-color:var(--fg2);background:var(--surface);font-weight:600}
.lgb.off{opacity:.45}
.oc[hidden]{display:none}
.xleg{margin-top:0}
.hist.gsel i{opacity:.18}

<script>
let DATA=null;
let SHORT=[];
/* Umschalter: drei Ordnungen der Landschaft. Die Wahl gilt auch für Schwerpunkt-Karten und Querverbindungen. */
let SCHEME="kat";try{SCHEME=localStorage.getItem("wbr-scheme")||"kat"}catch(e){}
const DISP={"Digitale Publikationen der Stadt Wien":"Publikationen Stadt Wien","(keiner Kachel zugeordnet)":"ohne Kachel"};
const disp=l=>DISP[l]||l;
const SINFO={kat:{one:"Thema",many:"Themen",in:"diesem Thema",
  lede:"Geordnet nach Themen: Jedes Objekt gehört zu genau einem von elf Themen. Die Bestände und die bisherigen Kacheln spielen hier keine Rolle."},
 leb:{one:"Lebensstation",many:"Lebensstationen",in:"dieser Lebensstation",
  lede:"Geordnet nach Lebensstationen, von der Kindheit bis zum Abschied. Das passt nicht auf alles: Briefe, Politik, Literatur und Musik stehen unter „Übrige Sammlung“."},
 gat:{one:"Gattung",many:"Gattungen",in:"dieser Gattung",
  lede:"Geordnet danach, was ein Objekt ist: Brief, Plakat, Buch, Noten … Jedes Objekt hat genau eine Gattung. Kleindrucke bis 8 Seiten sind von Büchern getrennt; die Grenze ist aus dem Umfang abgeleitet."},
 ep:{one:"Epoche",many:"Epochen",in:"dieser Epoche",
  lede:"Geordnet nach Abschnitten der Wiener Geschichte, von den Türkenbelagerungen bis heute. Jede Zeile zeigt, was in diesem Abschnitt erschienen oder geschrieben wurde; zusammen ergeben sie eine Treppe. Wo ein genaues Datum bekannt ist, entscheidet der Tag, etwa der 12. März 1938."},
 her:{one:"Herkunft",many:"Herkunftsregionen",in:"dieser Region",
  lede:"Geordnet nach dem Ort, an dem ein Brief geschrieben oder ein Druck gedruckt wurde, in den Grenzen um 1900: Triest und Prag zählen zur Habsburgermonarchie, Breslau zu Deutschland. Nur gut jedes vierte Objekt stammt aus Wien."},
 ges:{one:"Urheber*innen",many:"Urheber*innen",in:"dieser Gruppe",
  lede:"Geordnet nach dem Geschlecht der Urheber*innen (Verfasser*in, Komponist*in, Künstler*in …), wie es in der GND steht. Wer keine GND-Nummer hat oder ohne Angabe ist, steht unter „Urheber*in ohne Angabe“."},
 ber:{one:"Berufsgruppe",many:"Berufsgruppen",in:"dieser Berufsgruppe",
  lede:"Geordnet nach dem Beruf der Urheber*innen, wie ihn die GND angibt, zu neun Gruppen zusammengefasst. Zählt der erste Beruf, der passt: Grillparzer ist Schriftsteller, auch wenn er Archivdirektor war."},
 ers:{one:"Erschließung",many:"Erschließungsstufen",in:"dieser Stufe",
  lede:"Geordnet danach, wie gut ein Objekt beschrieben ist. Nur mit Tagesdatum und GND-Person entstehen Querverbindungen, Kalender und Personenseiten. Eine Sicht von innen, wie die interne Ordnung."},
 best:{one:"Gruppe der internen Ordnung",many:"Gruppen der internen Ordnung",in:"dieser Gruppe",
  lede:"Die interne Ordnung: So liegen die Daten heute im System, in sechs Gruppen nach Lieferweg und Digitalisierungsprojekt. Für Besucher*innen sagt das wenig, fast alles außer Briefen, Theaterzetteln und Familienanzeigen steckt in „Retrodigitalisierung“."},
 kach:{one:"Kachel",many:"Kacheln",in:"dieser Kachel",
  lede:"Die Ordnung der bisherigen Startseiten-Kacheln. Ein Objekt kann mehreren Kacheln angehören, daher ergeben die Zeilen zusammen mehr als die Gesamtzahl."}};
function labsOf(o){return SCHEME==="kat"?[SHORT[o.b]]:SCHEME==="gat"?[o.gt]:SCHEME==="leb"?[o.ls]:SCHEME==="ep"?[o.ep]:SCHEME==="her"?[o.hk]:SCHEME==="ges"?[o.gs]:SCHEME==="ber"?[o.br]:SCHEME==="ers"?[o.er]:SCHEME==="best"?[o.bs]:(o.kc||[])}
function spLabels(sp){const L=DATA.landscape.schemes[SCHEME].order,set=new Set();
  sp.groups.forEach(g=>g.objs.forEach(id=>{const o=DATA.objects[id];if(o)labsOf(o).forEach(l=>set.add(l))}));
  return L.filter(l=>set.has(l))}
/* Köpfe auf den Schwerpunkt-Karten der Startseite */
function spFaces(p){let gs=[];
  if(p.faces)gs=p.faces;
  else if(p.people)gs=p.people.map(x=>x[0]);
  else if(p.kind==="network")gs=[p.center.g,...p.nodes.map(n=>n.g)];
  else if(p.kind==="lifeline")gs=[p.life.gnd];
  else if(p.kind==="map")gs=Object.values(p.geoPor||{}).flat();
  gs=gs.filter(g=>g&&DATA.portraits&&DATA.portraits[g]).slice(0,5);
  return gs.length?`<span class="faces">${gs.map(g=>por(g,15)).join("")}</span>`:""}
function setScheme(k){SCHEME=k;try{localStorage.setItem("wbr-scheme",k)}catch(e){}render()}
/* Farbe je Zeile der gewählten Ordnung, feste Reihenfolge; Restzeilen grau. Ab 12 Zeilen: helle Variante der Grundfarben.
   Die Bezeichnung steht immer als Text daneben, die Farbe allein trägt keine Bedeutung. */
const GRAY=new Set(["Nicht zugeordnet","(keiner Kachel zugeordnet)","Übrige Sammlung","Ohne Jahr","Ort nicht zugeordnet","Ohne Ort","Urheber*in ohne Angabe","Ohne genannte Urheber*in","Sonstiger Beruf","Ohne Berufsangabe"]);
const col=l=>{if(!DATA||GRAY.has(l))return "var(--gray)";const O=DATA.landscape.schemes[SCHEME].order.filter(x=>!GRAY.has(x));const j=O.indexOf(l);
  if(j<0)return "var(--gray)";return j<12?`var(--c${j})`:`color-mix(in srgb,var(--c${j-12}) 50%,var(--surface))`};
/* Farbe einer Zeile in einer bestimmten Ordnung, unabhängig von der gerade gewählten (für die Zweitfärbung nach Gattung) */
const colS=(sc,l)=>{if(!DATA||GRAY.has(l))return "var(--gray)";const O=DATA.landscape.schemes[sc].order.filter(x=>!GRAY.has(x));const j=O.indexOf(l);
  if(j<0)return "var(--gray)";return j<12?`var(--c${j})`:`color-mix(in srgb,var(--c${j-12}) 50%,var(--surface))`};
const swl=l=>`<span class="lab"><i class="sw" style="background:${col(l)}"></i>${esc(disp(l))}</span>`;
const fmt=n=>(+n).toLocaleString("de-AT");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tip=document.getElementById("tip");
function showTip(e,h){tip.innerHTML=h;tip.style.opacity=1;tip.style.left=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8)+"px";tip.style.top=(e.clientY+16)+"px"}
function hideTip(){tip.style.opacity=0}

const TEXT={
 "tag":"Jedes Kästchen ist ein Kalendertag, mit einem Beispiel aus der Sammlung, das genau dieses Datum trägt. Über alle Jahre hinweg kommen so Hunderte Objekte pro Tag zusammen: Briefe, Theaterzettel, Partezettel, Plakate. Ein Klick zeigt, was an diesem Tag in Wien geschrieben, gespielt und angekündigt wurde.",
 "1848":"Im März 1848 erzwangen Studenten, Bürger und Arbeiter in Wien den Rücktritt Metternichs. Mit der Pressefreiheit erschienen über Nacht Flugblätter, Zeitungen, Plakate und Spottlieder. Der Tagespuls zeigt, wie viel davon jeden Tag erschien, und wie die Flut nach der Einnahme Wiens Ende Oktober abbricht.",
 "wk1":"Kundmachungen, Aufrufe, Verordnungen: rund 1.500 Plakate des Ersten Weltkriegs, Jahr für Jahr nebeneinander wie an einer Hauswand. Von der Mobilmachung 1914 über Kriegsanleihen und Lebensmittelkarten bis zum Kriegsende.",
 "ebner":"Rund 5.500 Briefe von und an Marie von Ebner-Eschenbach. Das Netz zeigt ihre wichtigsten Briefpartner*innen. Linien zwischen den Punkten am Rand bedeuten: Diese beiden haben auch einander geschrieben, und die Briefe liegen ebenfalls hier.",
 "leben":"Franz Grillparzer (1791–1872) in allen Spuren, die er in der Sammlung hinterlassen hat. Jeder Punkt ist ein Objekt. Die helle Fläche ist seine Lebenszeit, was rechts davon liegt, ist Nachleben: Ausgaben, Gedenkschriften und Aufführungen seiner Stücke bis in die 1930er Jahre.",
 "werk":"Wie eine Operette entsteht und weiterlebt: von der eigenhändigen Partitur von Johann Strauss über den Notendruck bis zu den Aufführungen auf Wiener Bühnen in den 1930er Jahren. Vier Werke, vier Wege.",
 "hochzeit":"Vermählungsanzeigen aus dem 19. und frühen 20. Jahrhundert, viele aus dem Adel. Jeder Bogen ist eine Heirat zwischen zwei Familien, die mehrmals vorkommen. Ein Klick auf eine Familie zeigt ihre Hochzeiten und Partezettel.",
 "friedhof":"Partezettel kündigten Tod und Begräbnis an. Wo der Friedhof genannt ist, liegt er hier auf dem Plan: je größer der Kreis, desto mehr Partezettel. Manche dieser Friedhöfe gibt es nicht mehr, sie wurden zu Parks.",
 "theater":"Fast 10.000 Theaterzettel zeigen, was zwischen 1930 und 1939 auf Wiens Bühnen gespielt wurde, von der Operette bis zur Oper. Freiwillige haben im Crowdsourcing Stücke, Mitwirkende und Regie erfasst. Jede Spielstätte hat ihr eigenes Profil.",
 "stadt":"Was die Stadtverwaltung heute veröffentlicht: Statistik, Budget, Wirtschaftsberichte und das Magazin „Mein Wien“. Diese Sammlung wächst laufend."
};

/* ---------- routing ----------
   Alle Wege haben dieselben vier Stufen: 0 Landschaft › 1 Auswahl › 2 Gruppe › 3 Objekt
   Schwerpunkt: #s-<sp>-<gruppe>-o<id>
   Zeile:       #z-<ordnung>-<zeile>~g<gruppe>-o<id>   Gruppe = Jahrzehnt und/oder Briefbündel
   Person:      #p-<GND>~g<gruppe>-o<id>                                                     */
function parseHash(){const H=location.hash||"";
  const z=H.match(/^#z-([a-z]+)-(\d+)(?:~g([^~]*?))?(?:-o(\d+))?$/);
  if(z)return {z:`${z[1]}-${z[2]}`,zs:z[1],zr:+z[2],g:z[3]?decodeURIComponent(z[3]):null,o:z[4]||null};
  const pm=H.match(/^#p-(.+?)(?:~g([^~]*?))?(?:-o(\d+))?$/);
  if(pm)return {p:decodeURIComponent(pm[1]),g:pm[2]?decodeURIComponent(pm[2]):null,o:pm[3]||null};
  const m=H.match(/^#s-(\d+)(?:-(\d+))?(?:-o(\d+))?$/);
  if(!m){const o=H.match(/^#o(\d+)$/);return o?{o:o[1]}:{}}
  return {s:+m[1],g:m[2]!=null?+m[2]:null,o:m[3]||null}}
function hashOf(st){let h="";
  if(st.z||st.p){h=st.z?`#z-${st.z}`:`#p-${encodeURIComponent(st.p)}`;if(st.g)h+=`~g${encodeURIComponent(st.g)}`;if(st.o)h+=`-o${st.o}`}
  else if(st.s!=null){h=`#s-${st.s}`;if(st.g!=null)h+=`-${st.g}`;if(st.o)h+=`-o${st.o}`}else if(st.o)h=`#o${st.o}`;return h}
function go(st){const h=hashOf(st);if(location.hash!==h){location.hash=h}else render()}
addEventListener("hashchange",render);
/* Gruppenschlüssel auf Zeilen- und Personenweg: "d1880", "dOJ", "a<Name>" oder beides, mit | getrennt */
function parseGroup(g){const r={dec:null,author:null,gat:null};if(!g)return r;
  g.split("|").forEach(p=>{if(p[0]==="d")r.dec=p==="dOJ"?"oj":+p.slice(1);else if(p[0]==="a")r.author=p.slice(1);else if(p[0]==="t")r.gat=p.slice(1)});return r}
function groupKey(dec,author,gat){const p=[];if(gat)p.push("t"+gat);if(dec!=null)p.push(dec==="oj"?"dOJ":"d"+dec);if(author)p.push("a"+author);return p.join("|")||null}
function groupLabel(st){const G=parseGroup(st.g),parts=[];if(G.gat)parts.push(G.gat);
  if(G.author)parts.push(st.p?`Briefwechsel mit ${shortName(G.author)}`:`Briefe von ${shortName(G.author)}`);
  if(G.dec!=null)parts.push(G.dec==="oj"?"ohne Jahr":`${G.dec}er Jahre`);return parts.join(", ")}

function crumbs(st){
  let l1=null,l2=null,l3=null,g1=null,g2=null;
  if(st.z||st.p){const S=st.z?DATA.landscape.schemes[st.zs]:null;
    l1=st.z?disp(S?S.order[st.zr]:"Zeile"):shortName(ALL&&ALL.gLab.get(st.p)||"Person");g1=st.z?{z:st.z}:{p:st.p};
    if(st.g){l2=groupLabel(st);g2={...g1,g:st.g}}
    if(st.o){const ob=DATA.objects[st.o]||(ALL&&ALL.pos.has(st.o)?{t:ALL.t[ALL.pos.get(st.o)]}:null);l3=ob&&ob.t||"Objekt"}}
  else{const sp=st.s!=null?DATA.sp[st.s]:null,gr=sp&&st.g!=null?sp.groups[st.g]:null;
    const ob=st.o?(DATA.objects[st.o]||(ALL&&ALL.pos.has(st.o)?{t:ALL.t[ALL.pos.get(st.o)]}:{t:"Objekt"})):null;
    if(sp){l1=sp.title;g1={s:st.s}}
    if(sp&&st.g!=null&&(sp.kind==="calendar"||st.g>=1e7)){l2=dateLabel(st.g);g2={s:st.s,g:st.g}}else if(gr){l2=gr.label;g2={s:st.s,g:st.g}}
    if(ob)l3=ob.t||"Objekt"}
  const items=[{lv:0,t:"Landschaft",go:{}},
    {lv:1,t:l1||"Auswahl",go:g1,hint:"Thema (oder eine andere Zeile der Landschaft), Schwerpunkt oder Person"},
    {lv:2,t:l2||"Gruppe",go:g2,hint:"Teil der Auswahl: Gruppe im Schwerpunkt, Jahrzehnt oder Briefwechsel"},
    {lv:3,t:l3||"Objekt",go:l3?st:null,hint:"Einzelnes Objekt mit Digitalisat"}];
  const lvl=l3?3:l2?2:l1?1:0;
  document.getElementById("crumbs").innerHTML=items.map((it,i)=>`${i?'<span class="sep">›</span>':""}<button class="crumb${it.lv===lvl?" on":""}" ${it.go?"":`disabled title="${esc(it.hint||"")}"`} data-i="${i}"><span class="lv">${it.lv}</span><span class="t">${esc(it.t)}</span></button>`).join("");
  document.querySelectorAll(".crumb").forEach(b=>b.onclick=()=>{const it=items[+b.dataset.i];if(it.go)go(it.go)});
}

/* ---------- year scale: 1500–1750 compressed ---------- */
function xScale(x0,w){const k=1750,f=.16;return y=>{y=Math.max(1500,Math.min(2026,y));return y<k?x0+(y-1500)/(k-1500)*w*f:x0+w*f+(y-k)/(2026-k)*w*(1-f)}}

/* ---------- Ebene 0 ---------- */
/* Gattungen in der Landschaft ein- und ausblenden. Sind alle sichtbar, zeigt die Landschaft jahresgenau in der Zeilenfarbe;
   ist mindestens eine ausgeblendet, jahrzehntgenau und nach den sichtbaren Gattungen geschichtet (vorberechnete Zahlen). */
let GHIDE=new Set();try{GHIDE=new Set(JSON.parse(localStorage.getItem("wbr-ghide")||"[]"))}catch(e){}
function setGHide(s){GHIDE=s;try{localStorage.setItem("wbr-ghide",JSON.stringify([...s]))}catch(e){}const y=scrollY;render();scrollTo({top:y})}
function level0(){
  const L=DATA.landscape.schemes[SCHEME],O=L.order,total=DATA.landscape.total,I=SINFO[SCHEME];
  const W=1140,lw=Math.max(176,Math.max(...O.map(b=>disp(b).length))*7.4+8),rw=64,pw=W-lw-rw,bandH=50,gap=8;
  const sps=[];/* Schwerpunkt-Leiste über der Landschaft entfernt; die Schwerpunkte stehen als Karten darunter */
  // lanes for pills
  const X=xScale(lw,pw);const lanes=[];sps.sort((a,b)=>a.span[0]-b.span[0]);
  sps.forEach(s=>{const w=Math.max(X(s.span[1]+1)-X(s.span[0]),s.title.length*6.6+20);const x=Math.min(X(s.span[0]),lw+pw-w);s.px=x;s.pw=w;
    let l=lanes.findIndex(e=>e<x-6);if(l<0){l=lanes.length;lanes.push(0)}lanes[l]=x+w;s.lane=l});
  const pillTop=8,laneH=30,bandsTop=pillTop+lanes.length*laneH+14;
  const H=bandsTop+O.length*(bandH+gap)+28;
  let s=`<svg class="lscape" viewBox="0 0 ${W} ${H}" role="img" aria-label="Alle Objekte auf der Zeitachse, nach ${I.one}">`;
  [1500,1600,1700,1750,1800,1850,1900,1950,2000].forEach(y=>{s+=`<line x1="${X(y)}" x2="${X(y)}" y1="${bandsTop-6}" y2="${H-22}" stroke="var(--grid)"/><text class="ax" x="${X(y)}" y="${H-6}" text-anchor="middle">${y}</text>`});
  s+=`<text class="ax" x="${lw+pw+10}" y="${H-6}">o. J.</text>`;
  s+=`<g id="hlband"></g>`;
  const GO=DATA.landscape.schemes.gat.order,filt=GHIDE.size>0;
  const vis=b=>((L.gdec||{})[b]||[]).filter(([gi])=>!GHIDE.has(GO[gi]));
  const decSum=(b,k)=>vis(b).reduce((a,[,arr])=>a+arr[k],0);
  O.forEach((b,r)=>{const y0=bandsTop+r*(bandH+gap),base=y0+bandH,arr=L.bands[b];
    const nVis=filt?vis(b).reduce((a,[,arr])=>a+arr.reduce((x,y)=>x+y,0),0):L.n[b];
    s+=`<g class="rowlink" tabindex="0" role="link" data-b="${r}" aria-label="Alle Objekte: ${esc(disp(b))}"><text class="bl" x="0" y="${y0+18}">${esc(disp(b))}</text><text class="bn" x="0" y="${y0+34}">${fmt(nVis)}${filt?` von ${fmt(L.n[b])}`:""} ›</text></g>`;
    let mx,u;
    if(!filt){mx=Math.max(...arr);
      let d="";arr.forEach((v,i)=>{if(!v)return;const y=1500+i,x=X(y),w=Math.max(1,X(y+1)-x-.4),h=Math.max(1.2,Math.sqrt(v/mx)*(bandH-4));d+=`M${x.toFixed(1)},${base}h${w.toFixed(2)}v${(-h).toFixed(1)}h${(-w).toFixed(2)}z`});
      s+=`<path d="${d}" fill="${col(b)}"/>`;u=L.undated[b]||0}
    else{const V=vis(b);mx=Math.max(1,...Array.from({length:53},(_,k)=>decSum(b,k)));
      for(let k=0;k<53;k++){const tot=decSum(b,k);if(!tot)continue;const ya=1500+k*10,x=X(ya),w=Math.max(1.5,X(Math.min(2026,ya+10))-x-1),hh=Math.max(1.5,Math.sqrt(tot/mx)*(bandH-4));
        let yb=base;V.forEach(([gi,a])=>{const v=a[k];if(!v)return;const seg=hh*v/tot;yb-=seg;s+=`<rect x="${x.toFixed(1)}" y="${yb.toFixed(1)}" width="${w.toFixed(1)}" height="${seg.toFixed(2)}" fill="${colS("gat",GO[gi])}"/>`})}
      u=decSum(b,53)}
    s+=`<line x1="${lw}" x2="${lw+pw}" y1="${base}" y2="${base}" stroke="var(--rule)"/>`;
    const uh=u?Math.max(1.2,Math.min(1,Math.sqrt(u/mx))*(bandH-4)):0;
    if(uh)s+=`<rect x="${lw+pw+14}" y="${base-uh}" width="14" height="${uh}" rx="2" fill="none" stroke="${filt?"var(--fg2)":col(b)}" stroke-dasharray="3 2" stroke-width="1.5"/>`;
    s+=`<rect class="hov" data-b="${r}" x="${lw}" y="${y0}" width="${pw+rw}" height="${bandH}" fill="transparent"/>`});
  sps.forEach(p=>{const y=pillTop+p.lane*laneH;
    s+=`<g class="pill" tabindex="0" role="link" data-s="${p.i}" aria-label="Schwerpunkt ${esc(p.title)}"><line x1="${X(p.span[0])}" x2="${X(p.span[0])}" y1="${y+22}" y2="${bandsTop-4}" stroke="var(--rule)" stroke-dasharray="2 3"/><rect x="${p.px}" y="${y}" width="${p.pw}" height="22" rx="11"/><text x="${p.px+10}" y="${y+15}">${esc(p.title)}</text></g>`});
  s+=`</svg>`;

/* Gruppenliste als Zeitbänder (wie die Landschaft, eine Ebene tiefer): Dicke = Objekte pro Jahr,
   gemeinsame Zeitachse und gemeinsamer Maßstab für alle Gruppen des Schwerpunkts; rechts drei Vorschaubilder. */
/* Zeitachse der Gruppenbänder. Monatsgenau, wenn der Zeitraum höchstens 5 Jahre umfasst und Gruppen mit
   mindestens 60 % der Objekte zu einem Viertel tagesgenau datiert sind; die übrigen Gruppen werden dann
   gleichmäßig über die Monate ihres Jahres verteilt. Sonst jahresgenau. */
const qualM=g=>g.mhist&&g.mhist[1].reduce((a,b)=>a+b,0)>=.25*g.n;
function axisOf(sp){const spans=sp.groups.filter(g=>g.span).flatMap(g=>g.span);let y0=Math.min(...spans),y1=Math.max(...spans);
  const gs=sp.groups.filter(g=>g.hist),all=gs.reduce((a,g)=>a+g.n,0),q=gs.filter(qualM).reduce((a,g)=>a+g.n,0);
  if(y1-y0<=5&&all&&q>=.6*all)return {monthly:true,y0:y0*12,y1:y1*12+11};
  if(y1-y0<4){y0-=2;y1+=2}return {monthly:false,y0,y1}}
/* Schichten je Gattung, passend zur Achse: [[Gattung, [Werte ab h0]], ...] und h0 */
function layersOf(g,monthly){const GO=DATA.landscape.schemes.gat.order;
  if(monthly&&qualM(g)&&g.mhg)return {h0:g.mhist[0],L:g.mhg.map(([gi,a])=>[GO[gi],a])};
  if(monthly&&g.hg){return {h0:g.hist[0]*12,L:g.hg.map(([gi,a])=>{const o=[];a.forEach(v=>{for(let m=0;m<12;m++)o.push(v/12)});return [GO[gi],o]})}}
  if(g.hg)return {h0:g.hist[0],L:g.hg.map(([gi,a])=>[GO[gi],a])};return null}
function series(g,monthly){if(!monthly)return g.hist;if(qualM(g))return g.mhist;
  const [h0,cs]=g.hist,out=[];cs.forEach(v=>{for(let m=0;m<12;m++)out.push(v/12)});return [h0*12,out]}
function groupList(sp,si,title){
  const spans=sp.groups.filter(g=>g.span).flatMap(g=>g.span);if(!spans.length)return"";
  const {monthly,y0,y1}=axisOf(sp);
  const W=420,H=38,mid=H/2,X=y=>(y-y0)/(y1+1-y0)*W;
  const mx=Math.max(1,...sp.groups.filter(g=>g.hist).flatMap(g=>series(g,monthly)[1]));
  /* Band nach Gattung geschichtet: Gesamtdicke wie zuvor, darin die Gattungen anteilig, von der Mitte symmetrisch */
  const usedG=new Set();
  const band=(g,c)=>{if(!g.hist)return"";const [h0,cs]=series(g,monthly),LY=layersOf(g,monthly);
    const polys=[];
    if(LY){LY.L.forEach(([gl,arr])=>{const top=[],bot=[];let any=false;
      for(let y=y0;y<=y1;y++){const tot=cs[y-h0]||0,hh=tot>0?Math.max(1.2,Math.sqrt(tot/mx)*(H/2-2)):0,TT=2*hh;
        let cum=0;for(const [gl2,a2] of LY.L){if(gl2===gl)break;cum+=a2[y-LY.h0]||0}
        const v=arr[y-LY.h0]||0;if(v>0)any=true;const s0=tot?mid-TT/2+cum/tot*TT:mid,s1=tot?s0+v/tot*TT:mid,xa=X(y),xb=X(y+1);
        top.push(`${xa.toFixed(1)},${s0.toFixed(1)} ${xb.toFixed(1)},${s0.toFixed(1)}`);bot.unshift(`${xb.toFixed(1)},${s1.toFixed(1)} ${xa.toFixed(1)},${s1.toFixed(1)}`)}
      if(any){usedG.add(gl);polys.push(`<polygon points="${top.join(" ")} ${bot.join(" ")}" fill="${colS("gat",gl)}"/>`)}})}
    const top=[],bot=[];
    for(let y=y0;y<=y1;y++){const v=cs[y-h0]||0,hh=v>0?Math.max(1.2,Math.sqrt(v/mx)*(H/2-2)):0;const xa=X(y),xb=X(y+1);
      top.push(`${xa.toFixed(1)},${(mid-hh).toFixed(1)} ${xb.toFixed(1)},${(mid-hh).toFixed(1)}`);bot.unshift(`${xb.toFixed(1)},${(mid+hh).toFixed(1)} ${xa.toFixed(1)},${(mid+hh).toFixed(1)}`)}
    const out=Math.round(cs.reduce((a,v,k)=>a+((h0+k<y0||h0+k>y1)?v:0),0));
    return `<svg class="gband" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-g="${sp.groups.indexOf(g)}"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="${c}" stroke-opacity=".35"/>${polys.length?polys.join(""):`<polygon points="${top.join(" ")} ${bot.join(" ")}" fill="${c}"/>`}</svg>${out?`<span class="gout">+${fmt(out)} außerhalb</span>`:""}`};
  const ticks=(()=>{const st=monthly?[1,2,3,6,12].find(s=>(y1-y0)/s<=7)||12:[1,2,5,10,20,25,50,100].find(s=>(y1-y0)/s<=6)||100,a=[];for(let y=Math.ceil(y0/st)*st;y<=y1;y+=st)a.push(y);return a})();
  const tlab=y=>monthly?`${MONATE[y%12].slice(0,3)}${y%12===0||y===ticks[0]?" "+Math.floor(y/12):""}`:y;
  /* eine ruhige Farbe für alle Bänder; die Gruppen unterscheiden sich durch Form und Beschriftung */
  const rows=sp.groups.map((g,i)=>{const c="var(--c0)";
    const pick=g.objs.length>2?[g.objs[0],g.objs[Math.floor(g.objs.length/2)],g.objs[g.objs.length-1]]:g.objs;
    return `<div class="grp2" role="link" tabindex="0" data-g="${i}"><div class="gl"><b>${esc(g.label)}</b><span class="note">${fmt(g.n)} Objekte${g.span?` · ${g.span[0]===g.span[1]?g.span[0]:g.span[0]+"–"+g.span[1]}`:""}</span></div>
      <div class="gb">${band(g,c)}</div><div class="gt">${pick.map(id=>`<span class="oc tile" data-o="${id}" style="--c:${c}"><span class="ph"></span></span>`).join("")}</div></div>`}).join("");
  const axis=`<div class="gaxis"><div></div><div class="gax">${ticks.map(y=>`<span style="left:${X(y)/W*100}%">${tlab(y)}</span>`).join("")}</div><div></div></div>`;
  return `${title?`<div class="sechead"><h2>${esc(title)}</h2></div>`:""}<div class="split"><div class="panel">${axis}<div class="groups2">${rows}</div>${usedG.size?`<div class="legend hleg" style="padding:6px 12px 2px"><span class="note">Farben nach Gattung:</span>${DATA.landscape.schemes.gat.order.filter(l=>usedG.has(l)).map(l=>`<span><i class="sw" style="background:${colS("gat",l)}"></i>${esc(l)}</span>`).join("")}</div>`:""}</div>
    <div class="facts"><div><b>${fmt(sp.n)}</b>Objekte in diesem Schwerpunkt</div>${sp.span?`<div><b>${sp.span[0]}–${sp.span[1]}</b>Zeitraum (ohne Ausreißer)</div>`:""}<div><b>${sp.groups.length}</b>Gruppen, gebildet aus ${groupBasis(sp.id)}</div>
    <p class="note">Jedes Band zeigt, wie viele Objekte der Gruppe aus welchem Jahr stammen: je dicker, desto mehr, geschichtet nach Gattung. Alle Bänder haben dieselbe Zeitachse und denselben Maßstab. Rechts Beispiele aus der Gruppe.</p></div></div>`}
function bindGroups(si){document.querySelectorAll(".grp,.grp2").forEach(b=>{const open=()=>go({s:si,g:+b.dataset.g});b.onclick=open;b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}}});
  const sp=DATA.sp[si];document.querySelectorAll(".gband").forEach(sv=>{const g=sp.groups[+sv.dataset.g];if(!g||!g.hist)return;
    sv.onmousemove=e=>{const {monthly,y0,y1}=axisOf(sp),H=series(g,monthly);if(!H)return;
      const b=sv.getBoundingClientRect(),y=Math.floor(y0+(e.clientX-b.left)/b.width*(y1+1-y0));
      showTip(e,`${esc(g.label)} · ${monthly?MONATE[y%12]+" "+Math.floor(y/12):y}<br><b>${fmt(Math.round(H[1][y-H[0]]||0))}</b> Objekte${monthly&&!qualM(g)?" (geschätzt, nur Jahr bekannt)":""}`)};sv.onmouseleave=hideTip});
  thumbs(document.getElementById("stage"))}
const tile=(id,c,tt)=>`<button class="oc tile" data-o="${id}" style="--c:${c||"var(--s0)"}" ${tt?`data-tt="${esc(tt)}"`:""} aria-label="${esc(tt||"Objekt")}"><span class="ph"></span></button>`;
function bindTiles(si,gfn){document.querySelectorAll("#stage .tile").forEach(t=>{t.onclick=()=>go({s:si,g:gfn?gfn(t):null,o:t.dataset.o});
  t.onmousemove=e=>{if(t.dataset.tt)showTip(e,esc(t.dataset.tt))};t.onmouseleave=hideTip})}
const titleOf=id=>{const j=ALL&&ALL.pos.get(String(id));return j==null?"":`${ALL.t[j]}${ALL.y[j]?` (${ALL.y[j]})`:""}`};
const MONATE=["Jänner","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function dateLabel(g){g=+g;if(g>=1e7){const y=Math.floor(g/1e4),m=Math.floor(g/100)%100,d=g%100;return `${d}. ${MONATE[m-1]} ${y}`}return `${g%100}. ${MONATE[Math.floor(g/100)-1]}`}

/* 1848 Tag für Tag */
function vPulse(sp,si){const P=sp.pulse,C=P.cats,cc=C.map(c=>c==="Andere"?"var(--gray)":colS("gat",c));/* Gattungsfarben wie überall */
  const TOT=C.map((c,k)=>P.days.reduce((a,d)=>a+d[1][k],0));
  const t0=Date.UTC(1848,2,1),day=86400000,N=306,W=1100,l=36,top=64,ph=190,H=top+ph+34,bw=(W-l-8)/N;
  const dn=d=>Math.round((Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))-t0)/day);
  /* Briefe laufen jeden Tag gleichmäßig mit und würden die Ausschläge der Drucke verdecken: sie stehen nur im Tooltip */
  const BI=C.indexOf("Brief"),noB=v=>v.map((n,k)=>k===BI?0:n);
  const mx=Math.max(...P.days.map(d=>noB(d[1]).reduce((a,b)=>a+b,0)));
  let s=`<svg class="lscape" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tagespuls 1848">`;
  for(let m=2;m<12;m++){const x=l+dn(`1848-${String(m+1).padStart(2,"0")}-01`)*bw;s+=`<line x1="${x}" x2="${x}" y1="${top}" y2="${top+ph}" stroke="var(--grid)"/><text class="ax" x="${x+3}" y="${H-8}">${MONATE[m]}</text>`}
  P.events.forEach((e,i)=>{const x=l+dn(e[0])*bw+bw/2,yy=14+(i%3)*16;s+=`<line x1="${x}" x2="${x}" y1="${yy+4}" y2="${top+ph}" stroke="var(--fg2)" stroke-dasharray="2 3" opacity=".6"/><text x="${x+3}" y="${yy}" style="font-size:11px;fill:var(--fg2)">${esc(e[1])}</text>`});
  P.days.forEach(([d,v0])=>{const v=noB(v0),x=l+dn(d)*bw,tot=v.reduce((a,b)=>a+b,0),T=Math.sqrt(tot/mx)*ph;let y=top+ph;v.forEach((n,k)=>{if(!n)return;const hh=Math.max(1,T*n/tot);y-=hh;s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1,bw-.6).toFixed(2)}" height="${hh.toFixed(1)}" fill="${cc[k]}"/>`});
    s+=`<rect class="pday" data-d="${d}" x="${x.toFixed(1)}" y="${top}" width="${bw.toFixed(2)}" height="${ph}" fill="transparent"/>`});
  s+=`<line x1="${l}" x2="${W-8}" y1="${top+ph}" y2="${top+ph}" stroke="var(--rule)"/></svg>`;
  const lg=`<div class="legend">${C.map((c,k)=>k===BI||!TOT[k]?"":`<span><i class="sw" style="background:${cc[k]}"></i>${esc(c==="Plakat"?"Plakat / Maueranschlag (ab 35 cm)":c)} <span class="note">${fmt(TOT[k])}</span></span>`).join("")}</div>`;
  return {html:`<div class="panel scroll">${s}</div>${lg}<p class="note">Ein Balken pro Tag, März bis Dezember 1848, Höhe gestaucht (Wurzel). Nur tagesgenau datierte Drucke; die Briefe desselben Tages aus der ganzen Sammlung stehen im Tooltip. Ein Klick auf einen Tag zeigt alles von diesem Datum.</p>`,
    listTitle:"Nach Monaten",bind:()=>document.querySelectorAll(".pday").forEach(r=>{const d=r.dataset.d,v=P.days.find(x=>x[0]===d)[1];
      r.onclick=()=>go({s:si,g:+d.replace(/-/g,"")});r.onmousemove=e=>showTip(e,`${dateLabel(+d.replace(/-/g,""))}<br>${C.map((c,k)=>v[k]?`${esc(c)}: <b>${v[k]}</b>`:"").filter(Boolean).join("<br>")}`);r.onmouseleave=hideTip})}}

/* Wand des Ersten Weltkriegs als Spirale: Abstand vom Mittelpunkt = Jahr, Winkel = mittlere Helligkeit.
   Bilder aus Sprite-Sheets (sprites/wk1-*.jpg, sprites/wk1.js), einmal vorab gedrosselt geladen. */
let SPRITEP=null;
function loadSprites(){if(window.WK1SPRITE)return Promise.resolve(window.WK1SPRITE);
  if(!SPRITEP)SPRITEP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="sprites/wk1.js";s.onload=()=>res(window.WK1SPRITE);s.onerror=rej;document.head.appendChild(s)});
  return SPRITEP.then(S=>Promise.all(S.sheets.map(u=>new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=u}))).then(ims=>{S.img=ims;return S}))}
function vWall(sp,si){
  const html=`<div class="panel radwrap"><canvas id="rad" aria-label="Weltkriegsplakate als Spirale: innen 1914, außen 1918, im Kreis nach Helligkeit"></canvas>
    <div class="radtools"><button class="more" id="zin" aria-label="Vergrößern">+</button><button class="more" id="zout" aria-label="Verkleinern">−</button><button class="more" id="zreset">Ganze Spirale</button></div>
    <p class="loading" id="radmsg">Lade Plakatbilder …</p></div>
    <p class="note">Jedes Bild ist ein Plakat. Die Plakate folgen der Spirale von innen (1914) nach außen (1918), gegen den Uhrzeigersinn; innerhalb eines Jahres von dunkel nach hell. Beim Hineinzoomen werden die Plakate in voller Auflösung von digital.wienbibliothek.at nachgeladen. Mausrad oder Knöpfe zoomen, Ziehen verschiebt, ein Klick öffnet das Plakat.</p>`;
  return {html,listTitle:"Nach Jahren",bind:()=>{
    loadSprites().then(S=>{const cv=document.getElementById("rad");if(!cv)return;document.getElementById("radmsg").remove();radial(cv,S,sp,si)})
      .catch(()=>{const m=document.getElementById("radmsg");if(m)m.textContent="Die Plakatbilder fehlen (Ordner „sprites“ neben index.html)."})}}}
/* Hintergrund wie eine verputzte Hauswand: warmes Grau mit feiner Körnung und leichten Flecken (zufällig, aber fest) */
let WALLP=null,WALLC="";
function wallPattern(c){const base=getComputedStyle(document.documentElement).getPropertyValue("--wall").trim()||"#d6d0c4";
  if(WALLP&&WALLC===base)return WALLP;const S=256,o=document.createElement("canvas");o.width=o.height=S;const g=o.getContext("2d");
  g.fillStyle=base;g.fillRect(0,0,S,S);let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let k=0;k<14;k++){const x=rnd()*S,y=rnd()*S,r=20+rnd()*70,gr=g.createRadialGradient(x,y,0,x,y,r),dk=rnd()<.5;
    gr.addColorStop(0,dk?"rgba(80,60,40,.06)":"rgba(255,255,255,.07)");gr.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=gr;g.fillRect(0,0,S,S)}
  for(let k=0;k<5200;k++){const x=rnd()*S,y=rnd()*S,a=rnd()*.09;g.fillStyle=rnd()<.55?`rgba(70,55,40,${a})`:`rgba(255,255,255,${a})`;g.fillRect(x,y,rnd()<.85?1:2,1)}
  WALLP=c.createPattern(o,"repeat");WALLC=base;return WALLP}
function radial(cv,S,sp,si){
  const years=[...new Set(S.items.map(it=>it[1]))].sort(),TW=13,TH=17,GAP=1.5,r0=52,dpr=window.devicePixelRatio||1;
  /* Spirale ohne Überlappung: Die Plakate folgen einer archimedischen Spirale von innen nach außen,
     zuerst nach Jahr, innerhalb des Jahres von dunkel nach hell. Jedes Plakat rückt so weit entlang
     der Spirale vor, bis es keines der bereits gesetzten berührt (Prüfung über ein Raster). */
  const pitch=Math.max(TW,TH)+3,rOf=th=>r0+pitch*th/(2*Math.PI),angOf=th=>-Math.PI/2-th;
  const CELL=24,grid=new Map(),key=(i,j)=>i+","+j;
  const P=[],labels=[];let th=0;
  const free=(x,y,w,h)=>{const i0=Math.floor((x-w/2)/CELL)-1,i1=Math.floor((x+w/2)/CELL)+1,j0=Math.floor((y-h/2)/CELL)-1,j1=Math.floor((y+h/2)/CELL)+1;
    for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const L=grid.get(key(i,j));if(L)for(const q of L){if(Math.abs(q.x-x)<(q.w+w)/2+GAP&&Math.abs(q.y-y)<(q.h+h)/2+GAP)return false}}return true};
  const put=p=>{const i=Math.floor(p.x/CELL),j=Math.floor(p.y/CELL),k=key(i,j);(grid.get(k)||grid.set(k,[]).get(k)).push(p)};
  years.forEach((y,yi)=>{const its=S.items.filter(it=>it[1]===y).sort((a,b)=>a[2]-b[2]);
    if(yi){th+=0.5;}labels.push([y,th]);th+=0.25;
    its.forEach(it=>{const sc=Math.min(TW/it[6],TH/it[7]),w=it[6]*sc,h=it[7]*sc;
      for(;;){const r=rOf(th),a=angOf(th),x=Math.cos(a)*r,y2=Math.sin(a)*r;if(free(x,y2,w,h)){const p={it,x,y:y2,w,h};P.push(p);put(p);th+=0.5/r;break}th+=0.6/r}})});
  const thMax=th,r=rOf(thMax)+TH;
  const R=r;let zoom=1,ox=0,oy=0;
  const fit=()=>{const W=cv.clientWidth;zoom=(W/2-10)/R;ox=0;oy=0};
  const size=()=>{const W=cv.clientWidth;cv.width=W*dpr;cv.height=W*dpr;cv.style.height=W+"px"};
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  /* Detailstufen: Gesamtansicht aus den Sprite-Sheets. Wird ein Plakat am Bildschirm deutlich größer als
     die Sprite-Kachel, lädt die Seite das Bild in passender Größe über IIIF nach (höchstens 2 gleichzeitig,
     nur für die bis zu 40 sichtbaren Plakate nahe der Bildmitte, erst wenn das Zoomen kurz ruht). */
  const HI=new Map(),HQ=[];let hrun=0,tw=null,raf=0,vis=new Set();
  const redraw=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})};
  function pump(){while(hrun<2&&HQ.length){const [id,L]=HQ.shift(),k=id+"@"+L,e=HI.get(k);if(!e)continue;if(!vis.has(id)){HI.delete(k);continue}hrun++;
    manifest(id).then(m=>{const u=thumbOf(m);if(!u)throw new Error("kein Bild");const url=u.replace(/\/full\/[^/]+\/0\//,`/full/,${L}/0/`);
      return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url})})
     .then(im=>{e.img=im;redraw()}).catch(()=>{e.fail=1}).finally(()=>{hrun--;pump()})}}
  const best=id=>{let b=null;for(const L of [1024,512,256]){const e=HI.get(id+"@"+L);if(e&&e.img){b=e.img;break}}return b};
  function draw(){const W=cv.clientWidth,c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);
    c.fillStyle=wallPattern(c);c.fillRect(0,0,W,W);c.translate(W/2+ox,W/2+oy);c.scale(zoom,zoom);
    c.strokeStyle="rgba(60,50,40,.18)";c.lineWidth=1/zoom;c.beginPath();for(let t=0;t<=thMax;t+=0.02){const rr=rOf(t),an=angOf(t);t?c.lineTo(Math.cos(an)*rr,Math.sin(an)*rr):c.moveTo(Math.cos(an)*rr,Math.sin(an)*rr)}c.stroke();
    const want=[];vis=new Set();
    P.forEach(p=>{const it=p.it,sx=W/2+ox+p.x*zoom,sy=W/2+oy+p.y*zoom,hs=p.h*zoom;
      if(sx<-hs||sx>W+hs||sy<-hs||sy>W+hs)return;
      const id=String(it[0]),hp=hs*dpr;let im=null;
      if(hp>110){vis.add(id);const L=hp>420?1024:hp>200?512:256;want.push([id,L,Math.hypot(sx-W/2,sy-W/2)]);im=best(id)}
      if(im)c.drawImage(im,p.x-p.w/2,p.y-p.h/2,p.w,p.h);
      else{const sh=S.img[it[3]];if(sh)c.drawImage(sh,it[4],it[5],it[6],it[7],p.x-p.w/2,p.y-p.h/2,p.w,p.h)}});
    c.font=`600 ${11}px Inter, system-ui, sans-serif`;c.textAlign="center";c.lineWidth=3;c.strokeStyle=css("--wall")||"#d6d0c4";c.fillStyle=css("--fg")||"#222";
    labels.forEach(([y,t],k)=>{const rr=rOf(t),an=angOf(t),x=Math.cos(an)*rr+(k?0:16),yy=Math.sin(an)*rr;/* 1914 etwas nach rechts, sonst verdeckt es das erste Plakat */c.strokeText(String(y),x,yy+4);c.fillText(String(y),x,yy+4)});
    clearTimeout(tw);tw=setTimeout(()=>{want.sort((a,b)=>a[2]-b[2]);const keep=new Set();
      want.slice(0,40).forEach(([id,L])=>{const k=id+"@"+L;keep.add(k);if(!HI.has(k)){HI.set(k,{});HQ.push([id,L])}});
      for(let i=HQ.length-1;i>=0;i--){const k=HQ[i][0]+"@"+HQ[i][1];if(!keep.has(k)){HQ.splice(i,1);const e=HI.get(k);if(e&&!e.img)HI.delete(k)}}pump()},250)}
  const toWorld=e=>{const b=cv.getBoundingClientRect(),W=cv.clientWidth;return [(e.clientX-b.left-W/2-ox)/zoom,(e.clientY-b.top-W/2-oy)/zoom]};
  const hit=e=>{const [x,y]=toWorld(e);for(let k=P.length-1;k>=0;k--){const p=P[k];if(Math.abs(x-p.x)<p.w/2+1&&Math.abs(y-p.y)<p.h/2+1)return p}return null};
  let drag=null,moved=false;
  cv.onmousedown=e=>{drag=[e.clientX,e.clientY,ox,oy];moved=false};
  addEventListener("mouseup",()=>{drag=null},{once:false});
  cv.onmousemove=e=>{if(drag){const dx=e.clientX-drag[0],dy=e.clientY-drag[1];if(Math.abs(dx)+Math.abs(dy)>3)moved=true;ox=drag[2]+dx;oy=drag[3]+dy;draw();hideTip();return}
    const p=hit(e);cv.style.cursor=p?"pointer":"grab";if(p)showTip(e,`${esc(titleOf(p.it[0])||"Plakat")}<br>${p.it[1]} · Helligkeit ${Math.round(p.it[2]/2.55)} %`);else hideTip()};
  cv.onmouseleave=hideTip;
  cv.onclick=e=>{if(moved)return;const p=hit(e);if(!p)return;const gi=sp.groups.findIndex(g=>g.label===String(p.it[1]));go({s:si,g:gi<0?null:gi,o:String(p.it[0])})};
  const zoomAt=(f,cx,cy)=>{const nz=Math.max(zoom*0.5,Math.min(zoom*f,60));const W=cv.clientWidth;cx=cx??W/2;cy=cy??W/2;
    ox=(ox+W/2-cx)*nz/zoom-(W/2-cx);oy=(oy+W/2-cy)*nz/zoom-(W/2-cy);zoom=nz;draw()};
  cv.addEventListener("wheel",e=>{e.preventDefault();const b=cv.getBoundingClientRect();zoomAt(e.deltaY<0?1.2:1/1.2,e.clientX-b.left,e.clientY-b.top)},{passive:false});
  document.getElementById("zin").onclick=()=>zoomAt(1.5);document.getElementById("zout").onclick=()=>zoomAt(1/1.5);
  document.getElementById("zreset").onclick=()=>{fit();draw()};
  size();fit();draw();
  const ro=new ResizeObserver(()=>{if(!cv.isConnected){ro.disconnect();return}size();fit();draw()});ro.observe(cv);
}

/* Vom Manuskript zur Bühne */
function vFlow(sp,si){const SG=ALL.labG.get("Strauss, Johann (1825-1899)");const st=(t,ids,c,extra)=>`<div class="fst"><div class="fh"><b>${t}</b><span class="note">${fmt(ids.length)}</span></div>${ids.length?`<div class="fgrid">${ids.slice(0,8).map(id=>tile(id,c,titleOf(id))).join("")}</div>`:`<p class="note">nicht in der Sammlung</p>`}${extra||""}</div>`;
  const html=sp.flow.map((w,wi)=>{const ys={};w.tz.forEach(([,y])=>ys[y]=(ys[y]||0)+1);const mx=Math.max(1,...Object.values(ys));
    const hist=w.tz.length?`<div class="fhist">${[1930,1931,1932,1933,1934,1935,1936,1937,1938,1939].map(y=>`<i style="height:${(ys[y]||0)/mx*100}%" title="${y}: ${ys[y]||0}"></i>`).join("")}</div><div class="histax"><span>1930</span><span>1939</span></div>`:"";
    const ven=[...new Set(w.tz.map(t=>t[2]).filter(Boolean))].slice(0,4).join(", ");
    /* Beteiligte mit Porträt: Personen mit GND aus allen Objekten zum Werk, ohne Strauss selbst, nach Häufigkeit */
    const cnt=new Map();[...w.hs,...w.nd,...w.other,...w.tz.map(t=>t[0])].forEach(id=>{const j=ALL.pos.get(String(id));if(j==null)return;
      new Set(ALL.pp[j].map(p=>p[2]).filter(Boolean)).forEach(g=>{if(g!==SG)cnt.set(g,(cnt.get(g)||0)+1)})});
    const ppl=[...cnt.entries()].filter(([g])=>DATA.portraits&&DATA.portraits[g]).sort((a,b)=>b[1]-a[1]).slice(0,7);
    const pline=ppl.length?`<div class="fppl"><span class="note">Beteiligte:</span>${ppl.map(([g,n])=>`<a href="#p-${encodeURIComponent(g)}" class="fp">${por(g,26,"m")}<span>${esc(shortName(ALL.gLab.get(g)))}<small>${n}×</small></span></a>`).join("")}</div>`:"";
    return `<div class="frow"><h2>${esc(w.work)}</h2>${pline}<div class="fflow">${st("Handschrift",w.hs,"var(--c0)")}<span class="farr">→</span>${st("Notendruck",w.nd,"var(--c1)")}<span class="farr">→</span>${st("Auf der Bühne 1930–39",w.tz.map(t=>t[0]),"var(--c2)",hist+(ven?`<p class="note">${esc(ven)}</p>`:""))}${w.other.length?`<span class="farr">·</span>${st("Weiteres",w.other,"var(--c3)")}`:""}</div>
      <button class="more" data-g="${wi}">Alle ${fmt(w.hs.length+w.nd.length+w.tz.length+w.other.length)} Objekte zu „${esc(w.work)}“ ›</button></div>`}).join("");
  const head=SG&&DATA.portraits[SG]?`<div class="fhead">${por(SG,44,"l2")}<div><b>Johann Strauss (Sohn)</b><span class="note">1825–1899 · Komponist aller vier Operetten</span></div></div>`:"";
  return {html:head+html,list:false,bind:()=>{bindTiles(si,t=>{const w=sp.flow.findIndex(f=>f.hs.includes(t.dataset.o)||f.nd.includes(t.dataset.o)||f.other.includes(t.dataset.o)||f.tz.some(x=>x[0]===t.dataset.o));return w<0?null:w});
    document.querySelectorAll(".frow .more").forEach(b=>b.onclick=()=>go({s:si,g:+b.dataset.g}))}}}

/* Lebenslinie */
function vLife(sp,si){const L=sp.life,W=1100,lw=150,pf=DATA.portraits&&DATA.portraits[L.gnd],top=pf?92:30,lh=34,H=top+L.lanes.length*lh+30;
  const xs=L.dots.map(d=>d[1]),x0=Math.min(1785,Math.floor(Math.min(...xs)/10)*10),x1=Math.max(1880,Math.ceil(Math.max(...xs)/10)*10);
  const X=y=>lw+(y-x0)/(x1-x0)*(W-lw-10);
  let s=`<svg class="lscape" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lebenslinie">`;
  /* Porträt aus Wikimedia Commons über der Lebenszeit, an ihrem Beginn */
  if(pf){const r=30,px=X(L.from)+r+4,py=r+4;s+=`<clipPath id="lpor"><circle cx="${px}" cy="${py}" r="${r}"/></clipPath><circle cx="${px}" cy="${py}" r="${r+2}" fill="var(--s0)"/><image href="${WM}${pf}?width=140" x="${px-r}" y="${py-r}" width="${2*r}" height="${2*r}" preserveAspectRatio="xMidYMin slice" clip-path="url(#lpor)" onerror="this.remove()"/>
    <text x="${px+r+10}" y="${py+5}" style="font:600 15px var(--display);fill:var(--fg)">${esc(L.name)}</text>`}
  s+=`<rect x="${X(L.from)}" y="${top-8}" width="${X(L.to)-X(L.from)}" height="${L.lanes.length*lh+8}" fill="var(--hl)"/>`;
  s+=`<text x="${X(L.from)}" y="${top-12}" style="font-size:11.5px;fill:var(--fg2)">* ${Math.floor(L.from)}</text><text x="${X(L.to)}" y="${top-12}" style="font-size:11.5px;fill:var(--fg2)" text-anchor="end">† ${Math.floor(L.to)}</text>`;
  for(let y=Math.ceil(x0/20)*20;y<=x1;y+=20)s+=`<line x1="${X(y)}" x2="${X(y)}" y1="${top-4}" y2="${H-24}" stroke="var(--grid)"/><text class="ax" x="${X(y)}" y="${H-8}" text-anchor="middle">${y}</text>`;
  L.lanes.forEach((ln,k)=>{const y=top+k*lh+lh/2;s+=`<text class="bl rowlink" data-g="${k}" x="0" y="${y+4}" style="cursor:pointer">${esc(ln)}</text><line x1="${lw}" x2="${W-10}" y1="${y}" y2="${y}" stroke="var(--rule)"/>`});
  const cc=k=>`var(--c${k})`;
  L.dots.forEach(([id,f,k])=>{const y=top+k*lh+lh/2+(((+id)%7)-3)*2.2;s+=`<circle class="ldot" data-o="${id}" data-g="${k}" cx="${X(f).toFixed(1)}" cy="${y.toFixed(1)}" r="3.6" fill="${cc(k)}" fill-opacity=".55"/>`});
  s+=`</svg>`;
  return {html:`<div class="panel scroll">${s}</div><p class="note">Jeder Punkt ist ein Objekt mit Bezug zu ${esc(L.name)} (GND ${esc(L.gnd)}), nach Datum. Hell hinterlegt: seine Lebenszeit. Ein Klick auf einen Punkt öffnet das Objekt, ein Klick auf eine Zeile die ganze Spur.</p>
    <a class="more" href="#p-${encodeURIComponent(L.gnd)}">Alle Objekte zu ${esc(L.name)} als Liste ›</a>`,listTitle:"Nach Art der Spur",
    bind:()=>{document.querySelectorAll(".ldot").forEach(c=>{c.onclick=()=>go({s:si,g:+c.dataset.g,o:c.dataset.o});c.onmousemove=e=>showTip(e,esc(titleOf(c.dataset.o)));c.onmouseleave=hideTip});
      document.querySelectorAll(".lscape .rowlink").forEach(t=>t.onclick=()=>go({s:si,g:+t.dataset.g}))}}}

/* Wer heiratete wen */
function vArcs(sp,si){const A=sp.arcs,F=A.fams,W=1100,l=20,base=300,H=440,n=F.length,X=i=>l+i*(W-2*l)/(n-1);
  const mxl=Math.max(...A.links.map(x=>x[2].length));
  let s=`<svg class="lscape" viewBox="0 0 ${W} ${H}" role="img" aria-label="Heiraten zwischen Familien">`;
  A.links.forEach(([a,b,ids],k)=>{const x1=X(a),x2=X(b),r=(x2-x1)/2;s+=`<path class="arc" data-k="${k}" d="M${x1},${base} A${r},${Math.min(r,base-20)} 0 0 1 ${x2},${base}" fill="none" stroke="var(--c4)" stroke-opacity=".7" stroke-width="${1.5+3*ids.length/mxl}"/>`});
  /* Porträt je Familie: ein Mitglied mit GND-Porträt aus den Hochzeits- und Partezetteln der Familie (Nachname passt) */
  const FP=F.map(([f],i)=>{const c=new Map();(sp.groups[i]?.objs||[]).forEach(id=>{const j=ALL.pos.get(String(id));if(j==null)return;
      ALL.pp[j].forEach(([lab,,g])=>{if(g&&DATA.portraits[g]&&lab.split(",")[0].trim()===f)c.set(g,(c.get(g)||0)+1)})});
    return [...c.entries()].sort((a,b)=>b[1]-a[1])[0]?.[0]||null});
  F.forEach(([f,m,p,y],i)=>{const x=X(i),pg=FP[i],r=pg?Math.max(12,3+Math.sqrt(m)*1.6):3+Math.sqrt(m)*1.6;
    const pf=pg&&DATA.portraits[pg],pim=pf?`<clipPath id="ap${i}"><circle cx="${x}" cy="${base}" r="${r-1.5}"/></clipPath><image href="${WM}${pf}?width=${Math.round(r*4)}" x="${x-r}" y="${base-r}" width="${2*r}" height="${2*r}" preserveAspectRatio="xMidYMin slice" clip-path="url(#ap${i})" onerror="this.remove()"/>`:"";
    s+=`<g class="fam" data-g="${i}" tabindex="0" role="link" aria-label="Familie ${esc(f)}"><circle cx="${x}" cy="${base}" r="${r}" fill="var(--c0)" stroke="var(--surface)" stroke-width="1.5"/>${pim}${p?`<rect x="${x-2}" y="${base+r+3}" width="4" height="${Math.min(40,3+p*1.2)}" fill="var(--gray)"/>`:""}
      <text x="${x}" y="${base+52}" transform="rotate(55 ${x} ${base+52})" style="font-size:11.5px;fill:var(--fg2)">${esc(f)}</text></g>`});
  s+=`</svg>`;
  return {html:`<div class="panel scroll">${s}</div><div class="legend"><span><i class="sw" style="background:var(--c0)"></i>Familie, Größe nach Zahl der Hochzeiten</span><span><i class="sw" style="background:var(--c4)"></i>Heirat zwischen zwei dieser Familien</span><span><i class="sw" style="background:var(--gray)"></i>Partezettel der Familie</span></div>
    <p class="note">Die ${n} Familien, die am häufigsten in Vermählungsanzeigen vorkommen, von links nach rechts nach ihrer ersten Hochzeit in der Sammlung. Familien sind am Nachnamen erkannt, das ist eine Annäherung.</p>`,listTitle:"Nach Familien",
    bind:()=>{document.querySelectorAll(".fam").forEach(g=>{const i=+g.dataset.g,f=F[i];g.onclick=()=>go({s:si,g:i});g.onkeydown=e=>{if(e.key==="Enter")go({s:si,g:i})};

/* Friedhöfe auf dem Plan */
function vMap(sp,si){const G=sp.geo,W=760,H=600,lo0=16.24,lo1=16.50,la0=48.13,la1=48.275;
  const P=(la,lo)=>[(lo-lo0)/(lo1-lo0)*W,(la1-la)/(la1-la0)*H];const pl=pts=>pts.map(p=>P(p[0],p[1]).map(v=>v.toFixed(1)).join(",")).join(" ");
  const ctr=P(48.2085,16.3731),km=W/((lo1-lo0)*111*Math.cos(48.2*Math.PI/180));
  let s=`<svg class="lscape" style="min-width:420px;max-width:760px" viewBox="0 0 ${W} ${H}" role="img" aria-label="Friedhöfe auf dem Plan">`;
  s+=`<polyline points="${pl([[48.275,16.352],[48.262,16.368],[48.245,16.386],[48.226,16.412],[48.205,16.440],[48.183,16.470],[48.165,16.50]])}" fill="none" stroke="var(--c0)" stroke-opacity=".35" stroke-width="10" stroke-linecap="round"/>`;
  s+=`<polyline points="${pl([[48.257,16.370],[48.232,16.367],[48.212,16.378],[48.196,16.400],[48.172,16.452]])}" fill="none" stroke="var(--c0)" stroke-opacity=".35" stroke-width="4"/>`;
  s+=`<circle cx="${ctr[0]}" cy="${ctr[1]}" r="${0.8*km}" fill="none" stroke="var(--rule)" stroke-width="3"/><circle cx="${ctr[0]-0.3*km}" cy="${ctr[1]+0.2*km}" r="${2.7*km}" fill="none" stroke="var(--rule)" stroke-width="2" stroke-dasharray="6 4"/>`;
  s+=`<circle cx="${ctr[0]}" cy="${ctr[1]}" r="3" fill="var(--fg2)"/><text x="${ctr[0]+6}" y="${ctr[1]-6}" style="font-size:11px;fill:var(--fg2)">Stephansdom</text>`;
  s+=`<text x="${P(48.262,16.37)[0]+12}" y="${P(48.262,16.37)[1]}" style="font-size:11px;fill:var(--muted)">Donau</text>`;
  const mx=Math.max(...sp.groups.map(g=>g.n));
  sp.groups.forEach((g,i)=>{const c=G[g.label];if(!c)return;const [x,y]=P(c[0],c[1]),r=6+Math.sqrt(g.n/mx)*30;
    /* Auf dem Plan nur eine Nummer; Name, Zahl und Porträts stehen in der Liste daneben (keine Überschneidungen) */
    s+=`<g class="fam" data-g="${i}" tabindex="0" role="link" aria-label="${esc(g.label)}"><circle cx="${x}" cy="${y}" r="${r}" fill="var(--c3)" fill-opacity=".6" stroke="var(--c3)"/><text x="${x}" y="${y+4}" text-anchor="middle" style="font:700 11.5px var(--body);fill:var(--fg)">${i+1}</text></g>`});
  s+=`<line x1="20" x2="${20+2*km}" y1="${H-20}" y2="${H-20}" stroke="var(--fg2)"/><text x="20" y="${H-26}" style="font-size:11px;fill:var(--fg2)">2 km</text></svg>`;
  const list=sp.groups.map((g,i)=>{const ps=((sp.geoPor||{})[g.label]||[]).filter(pg=>DATA.portraits[pg]).slice(0,7);
    return `<div class="fhl"><button class="fhn" data-g="${i}"><b>${i+1}</b><span>${esc(g.label)}</span><span class="note">${fmt(g.n)}</span></button>
      ${ps.length?`<div class="fhp">${ps.map(pg=>`<a href="#p-${encodeURIComponent(pg)}" class="fpor" data-n="${esc(pg)}">${por(pg,22,"m2")}</a>`).join("")}</div>`:""}</div>`}).join("");
  return {html:`<div class="panel"><div class="fhgrid"><div class="scroll">${s}</div><div class="fhlist"><span class="tag">Friedhöfe · Porträts von hier Bestatteten</span>${list}</div></div></div><p class="note">Plan vereinfacht: Donau, Donaukanal, Ring und Gürtel nur angedeutet, Lage der Friedhöfe gerundet. Kreisfläche nach Zahl der Partezettel. Rechts: Porträts von hier Bestatteten (Auswahl, aus Wikimedia Commons). Ein Klick auf Kreis oder Namen öffnet die Partezettel, ein Klick auf ein Porträt die Personenseite.</p>`,listTitle:"Nach Friedhof",
    bind:()=>{document.querySelectorAll(".fam").forEach(g=>{g.onclick=()=>go({s:si,g:+g.dataset.g});g.onkeydown=e=>{if(e.key==="Enter")go({s:si,g:+g.dataset.g})}});
      document.querySelectorAll(".fhn").forEach(b=>b.onclick=()=>go({s:si,g:+b.dataset.g}));
      document.querySelectorAll(".fpor").forEach(a=>{a.onmousemove=e=>showTip(e,ALL?esc(shortName(ALL.gLab.get(a.dataset.n)||"")):"Personenseite öffnen");a.onmouseleave=hideTip})}}}

/* Ein Tag in Wien */
function vCal(sp,si){const C=sp.cal,dim=[31,29,31,30,31,30,31,31,30,31,30,31],
    vals=Object.entries(C).filter(([k])=>{const m=Math.floor(k/100),d=k%100;return m>=1&&m<=12&&d>=1&&d<=dim[m-1]&&+k!==229}).map(([,v])=>v[0]).sort((a,b)=>a-b),
    lo=vals[Math.floor(vals.length*.02)],hi=vals[Math.floor(vals.length*.98)];
  const now=new Date(),today=(now.getMonth()+1)*100+now.getDate();
  let h=`<div class="cal" role="grid"><div></div>${Array.from({length:31},(_,d)=>`<div class="cd">${d+1}</div>`).join("")}`;
  for(let m=1;m<=12;m++){h+=`<div class="cm">${MONATE[m-1].slice(0,3)}</div>`;for(let d=1;d<=31;d++){const k=m*100+d;if(d>dim[m-1]){h+=`<div></div>`;continue}
    const v=C[k]||[0,[]],pct=v[0]?Math.round(10+90*Math.max(0,Math.min(1,(v[0]-lo)/Math.max(1,hi-lo)))):0;
    h+=`<button class="cday${k===today?" today":""}" data-k="${k}" aria-label="${dateLabel(k)}: ${v[0]} Objekte"><i style="width:${pct}%"></i></button>`}}
  h+=`</div>`;
  return {html:`<div class="panel scroll">${h}</div><div class="row"><p class="note">Jedes Kästchen zeigt ein Beispielobjekt mit genau diesem Datum, bevorzugt Plakate, Flugblätter und Theaterzettel. Der Balken unten zeigt, wie viele Objekte es zu diesem Tag gibt (von ${fmt(lo)} bis ${fmt(hi)}). Umrandet: heute.</p><button class="more" id="heute">Heute, ${dateLabel(today)} ›</button></div>`,list:false,
    bind:()=>{document.querySelectorAll(".cday").forEach(b=>{const k=+b.dataset.k,v=C[k]||[0,[]];b.onclick=()=>go({s:si,g:k});
      b.onmousemove=e=>showTip(e,`<b>${dateLabel(k)}</b>: ${fmt(v[0])} Objekte${v[1].length?"<br>"+v[1].map(([c,n])=>`${esc(c)} ${fmt(n)}`).join("<br>"):""}`);b.onmouseleave=hideTip});
      document.getElementById("heute").onclick=()=>go({s:si,g:today});
      /* Beispielbilder aus dem Sprite-Sheet sprites/tag.jpg; Lage per Prozent, damit die Kacheln mit der Breite mitwachsen */
      loadTagSprite().then(T=>{if(!T)return;document.querySelectorAll(".cday").forEach(b=>{const it=T.items[b.dataset.k];if(!it)return;
        b.style.backgroundImage=`url("${T.sheet}")`;b.style.backgroundSize=`${T.w/T.c*100}% ${T.h/T.c*100}%`;
        b.style.backgroundPosition=`${it[1]/(T.w-T.c)*100}% ${it[2]/(T.h-T.c)*100}%`;b.classList.add("img")})})}}}
let TAGP=null;
function loadTagSprite(){if(window.TAGSPRITE)return Promise.resolve(window.TAGSPRITE);
  if(!TAGP)TAGP=new Promise(res=>{const s=document.createElement("script");s.src="sprites/tag.js";s.onload=()=>res(window.TAGSPRITE);s.onerror=()=>res(null);document.head.appendChild(s)});return TAGP}

/* Ebene 2 für Tage: alle Objekte eines Kalendertags (über alle Jahre) oder eines genauen Datums */
function dayPage(st){loadAll(()=>{
  const cur=parseHash();if(cur.s!==st.s||cur.g!==st.g||cur.o)return;crumbs(st);
  const g=+st.g,exact=g>=1e7,idx=[];for(let j=0;j<ALL.N;j++){const d=ALL.d[j];if(d&&(exact?d===g:d%10000===g))idx.push(j)}
  idx.sort((a,b)=>ALL.d[a]-ALL.d[b]);
  /* Tagesseiten: Karten und Legende nach Gattung, wie auf den Listenseiten */
  const GO=DATA.landscape.schemes.gat.order,gl=j=>GO[ALL.gat[j]];
  const cnt=new Map();idx.forEach(j=>{const l=gl(j);cnt.set(l,(cnt.get(l)||0)+1)});
  const yrs=new Set(idx.map(j=>Math.floor(ALL.d[j]/1e4)));let shown=120;
  stage(`<div class="stack"><div class="stack" style="gap:8px"><span class="tag">Ebene 2 · Gruppe in „${esc(DATA.sp[st.s].title)}“</span><h1 style="font-size:clamp(24px,3.6vw,34px)">${esc(dateLabel(g))}</h1>
    <p class="lede">${fmt(idx.length)} Objekte${exact?"":` aus ${fmt(yrs.size)} verschiedenen Jahren`}.</p>
    <div class="legend hleg"><span class="note">Farben nach Gattung · Klick zeigt nur diese:</span>${[...cnt.entries()].sort((a,b)=>GO.indexOf(a[0])-GO.indexOf(b[0])).map(([l,n])=>`<button class="lgb" data-l="${esc(l)}" title="Nur ${esc(l)} zeigen"><i class="sw" style="background:${colS("gat",l)}"></i>${esc(l)} <span class="note">${fmt(n)}</span></button>`).join("")}</div></div>
    ${peopleStrip(topPeople(idx,10),"Häufigste Personen an diesem Tag")}
    <div id="dres" class="stack"></div></div>`);
  /* Klick auf eine Farbe der Legende filtert nach dieser Gattung (zweiter Klick hebt auf) */
  let gf=null;
  document.querySelectorAll(".lgb").forEach(b=>b.onclick=()=>{gf=gf===b.dataset.l?null:b.dataset.l;shown=120;
    document.querySelectorAll(".lgb").forEach(x=>{x.classList.toggle("on",x.dataset.l===gf);x.classList.toggle("off",!!gf&&x.dataset.l!==gf)});draw()});
  const draw=()=>{let h="",last=null,buf=[];const flush=()=>{if(buf.length)h+=`<div class="cards">${buf.join("")}</div>`;buf=[]};
    const fi=gf?idx.filter(j=>gl(j)===gf):idx;
    if(gf)h+=`<div class="sechead"><h2>${esc(gf)}</h2><span class="note">${fmt(fi.length)} von ${fmt(idx.length)}</span></div>`;
    fi.slice(0,shown).forEach(j=>{const y=Math.floor(ALL.d[j]/1e4);if(!exact&&y!==last){flush();h+=`<div class="sechead"><h2>${y}</h2></div>`;last=y}buf.push(jcard(j,{s:st.s,g:st.g},false,colS("gat",gl(j))))});flush();
    if(fi.length>shown)h+=`<button class="more" id="dmore">Weitere ${fmt(Math.min(240,fi.length-shown))} zeigen (${fmt(fi.length-shown)} übrig)</button>`;
    const el=document.getElementById("dres");el.innerHTML=h||`<p class="note">Keine Objekte mit diesem Datum.</p>`;
    el.querySelectorAll(".oc").forEach(b=>b.onclick=()=>go({s:st.s,g:st.g,o:b.dataset.o}));thumbs(el);
    const m=document.getElementById("dmore");if(m)m.onclick=()=>{shown+=240;draw()}};
  draw();
})}

function groupBasis(id){return {"1848":"den Unterrubriken nach Monaten","wk1":"dem Erscheinungsjahr","theater":"der Spielstätte","strauss":"der Kategorie","werk":"dem Werk","leben":"der Art der Spur","hochzeit":"der Familie","friedhof":"dem Friedhof (Schlagwort)","stadt":"der Publikationsreihe"}[id]||"den Metadaten"}

function network(sp){
  const W=760,H=760,cx=W/2,cy=H/2,R=270;
  const nodes=sp.nodes.map((n,i)=>({...n,i,tot:n.sent+n.recv}));
  const order=[...nodes].sort((a,b)=>(a.span?a.span[0]:9999)-(b.span?b.span[0]:9999));
  order.forEach((n,k)=>{n.a=-Math.PI/2+k/order.length*Math.PI*2;n.x=cx+R*Math.cos(n.a);n.y=cy+R*Math.sin(n.a)});
  const mx=Math.max(...nodes.map(n=>n.tot)),byG=Object.fromEntries(nodes.map(n=>[n.g,n]));
  const emx=Math.max(1,...sp.edges.map(e=>e[2]));
  let s=`<svg class="net" viewBox="0 0 ${W} ${H}" style="display:block;width:100%;min-width:520px" role="img" aria-label="Briefnetz">`;
  sp.edges.forEach(([a,b,n])=>{const A=byG[a],B=byG[b];if(!A||!B)return;s+=`<path class="edge" data-a="${A.i}" data-b="${B.i}" d="M${A.x},${A.y} Q${cx},${cy} ${B.x},${B.y}" fill="none" stroke="var(--s1)" stroke-opacity="${.25+.55*n/emx}" stroke-width="${1+3*Math.sqrt(n/emx)}"/>`});
  nodes.forEach(n=>{s+=`<line class="spoke" data-g="${n.i}" x1="${cx}" y1="${cy}" x2="${n.x}" y2="${n.y}" stroke="var(--s0)" stroke-opacity=".18" stroke-width="${1+6*n.tot/mx}"/>`});
  /* Porträts aus Wikimedia Commons in den Kreisen, wo vorhanden; sonst der blaue Punkt wie bisher */
  const pimg=(g,x,y,r,id)=>{const f=g&&DATA.portraits&&DATA.portraits[g];if(!f)return"";
    return `<clipPath id="${id}"><circle cx="${x}" cy="${y}" r="${r}"/></clipPath><image href="${WM}${f}?width=${Math.round(r*4)}" x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}" preserveAspectRatio="xMidYMin slice" clip-path="url(#${id})" onerror="this.remove()"/>`};
  const cimg=pimg(sp.center.g,cx,cy,40,"npc");
  s+=`<g class="ncenter" tabindex="0" role="link" aria-label="Marie von Ebner-Eschenbach: alle Objekte"><circle cx="${cx}" cy="${cy}" r="40" fill="var(--s0)"/>${cimg}<circle cx="${cx}" cy="${cy}" r="40" fill="none" stroke="var(--s0)" stroke-width="3"/>`+
    (cimg?`<text x="${cx}" y="${cy+58}" text-anchor="middle" style="fill:var(--fg);font-weight:600;font-size:12.5px">Marie von Ebner-Eschenbach</text>`
         :`<text x="${cx}" y="${cy-2}" text-anchor="middle" style="fill:#fff;font-weight:600;font-size:12px">Ebner-</text><text x="${cx}" y="${cy+12}" text-anchor="middle" style="fill:#fff;font-weight:600;font-size:12px">Eschenbach</text>`)+`</g>`;
  nodes.forEach(n=>{const hasP=!!(DATA.portraits&&DATA.portraits[n.g]);const r=Math.max(hasP?11:0,4+14*Math.sqrt(n.tot/mx));const deg=n.a*180/Math.PI;const flip=Math.cos(n.a)<0;const name=n.label.replace(/\s*\(.*\)$/,"");
    const lx=cx+(R+r+6)*Math.cos(n.a),ly=cy+(R+r+6)*Math.sin(n.a);
    s+=`<g class="node" tabindex="0" role="link" data-g="${n.i}" aria-label="${esc(name)}"><circle cx="${n.x}" cy="${n.y}" r="${r}" fill="var(--s0)" stroke="var(--surface)" stroke-width="2"/>${hasP?pimg(n.g,n.x,n.y,r-1.5,"np"+n.i):""}<text x="${lx}" y="${ly}" dy="4" transform="rotate(${flip?deg+180:deg} ${lx} ${ly})" text-anchor="${flip?"end":"start"}">${esc(name)}</text></g>`});
  return s+`</svg><div class="legend" style="margin-top:8px"><span><i class="sw" style="background:var(--s0)"></i>Briefe mit Ebner-Eschenbach</span><span><i class="sw" style="background:var(--s1)"></i>Briefe der Partner*innen untereinander</span></div>`;
}

  const examples=(ids,per,max)=>{const got=new Map(),out=[];const other=ids.filter(k=>!labsJ(k).some(l=>own.includes(l)));const pool=other.length?other:ids;
