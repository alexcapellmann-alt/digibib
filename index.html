      <a class="more" id="xa${bi}" href="#p-${encodeURIComponent(g)}">Alle ${fmt(ids.length+1)} Objekte zu ${esc(shortName(p[0]))} ›</a></div>`});
  if(ALL.d[j]){const ids=(ALL.byD.get(ALL.d[j])||[]).filter(k=>k!==j);
    if(ids.length){const d=new Date(dd+"T12:00:00");const ex=examples(ids,2,6);
      const bi=BX.length;
      xl+=`<div class="xbox"><h3>Am selben Tag, ${d.toLocaleDateString("de-AT",{day:"numeric",month:"long",year:"numeric"})}</h3>${chipsOf(ids,6,null)}<div class="cards x" id="xc${bi}">${ex.map(k=>jcard(k,ctx,true,gcol(k))).join("")}</div></div>`}}
  if(!xl)xl=`<div class="xbox"><h3>Querverbindungen</h3><p class="note">Für dieses Objekt gibt es keine Person mit GND-Nummer und kein genaues Datum, das es mit anderen teilt. Querverbindungen entstehen erst durch bessere Erschließung.</p></div>`;
  stage(`<div class="stack"><div class="stack" style="gap:8px"><span class="tag">Ebene 3 · Objekt</span><h1 style="font-size:clamp(22px,3.2vw,30px)">${esc(ALL.t[j]||"Ohne Titel")}</h1></div>
    <div class="detail"><div class="stack">${viewerHTML(ALL.i[j],ALL.y[j],kindJ(j),c)}
      <dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${r[2]?r[1]:esc(r[1])}</dd>`).join("")}</dl></div>
      <div class="xl"><span class="tag">Wege von hier aus</span>${xl}</div></div></div>`);
  const bindOc=root=>root.querySelectorAll(".oc").forEach(b=>b.onclick=()=>go({...ctx,o:b.dataset.o}));
  bindOc(document.getElementById("stage"));
  const initHTML={};BX.forEach((_,bi)=>{const el=document.getElementById("xc"+bi);if(el)initHTML[bi]=el.innerHTML});
  document.querySelectorAll(".xleg .lgb").forEach(b=>b.onclick=()=>{const bi=+b.dataset.b,B=BX[bi],box=document.getElementById("xc"+bi);
    const cur=box.dataset.f||"",l=cur===b.dataset.l?"":b.dataset.l;box.dataset.f=l;
    document.querySelectorAll(`.xleg .lgb[data-b="${bi}"]`).forEach(x=>{x.classList.toggle("on",x.dataset.l===l);x.classList.toggle("off",!!l&&x.dataset.l!==l)});
    box.innerHTML=l?B.ids.filter(k=>glx(k)===l).slice(0,B.max).map(k=>jcard(k,ctx,true,gcol(k))).join(""):initHTML[bi];bindOc(box);thumbs(box);
    const a=document.getElementById("xa"+bi);if(a&&B.link){const n=l?B.ids.filter(k=>glx(k)===l).length:B.ids.length+1;
      a.href=`#p-${encodeURIComponent(B.link)}${l&&SCHEME!=="gat"?`~g${encodeURIComponent("t"+l)}`:""}`;a.textContent=l?`Alle ${fmt(n)} × ${l} zu dieser Person ›`:`Alle ${fmt(n)} Objekte zu dieser Person ›`}});
  thumbs(document.getElementById("stage"));viewer(ALL.i[j]);
})}

/* ---------- IIIF: Vorschaubilder und Bildbetrachter, live von digital.wienbibliothek.at ---------- */
const IIIF="https://www.digital.wienbibliothek.at/i3f/v20/";
const MAN=new Map();
function manifest(id){if(!MAN.has(id))MAN.set(id,fetch(`${IIIF}${id}/manifest`).then(r=>r.ok?r.json():null).catch(()=>null));return MAN.get(id)}
function canvasesOf(m){try{return m.sequences[0].canvases}catch(e){return []}}
function thumbOf(m){if(!m)return null;let t=m.thumbnail;if(Array.isArray(t))t=t[0];if(t)return typeof t==="string"?t:t["@id"]||t.id;
  const c=canvasesOf(m)[0];try{return c.images[0].resource.service["@id"]+"/full/,300/0/default.jpg"}catch(e){return null}}
const TQ=[];let TRUN=0;
/* höchstens 2 gleichzeitig: der IIIF-Server hat bei 4 parallelen Anfragen schon einmal nicht mehr geantwortet */
function tpump(){while(TRUN<2&&TQ.length){const el=TQ.shift();if(!el.isConnected)continue;TRUN++;
  manifest(el.dataset.o).then(m=>{const u=thumbOf(m),ph=el.querySelector(".ph");if(u&&ph){const im=new Image();im.onload=()=>{ph.style.backgroundImage=`url("${u}")`;ph.classList.add("img")};im.src=u}})
    .finally(()=>{TRUN--;tpump()})}}
const TOBS="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){TOBS.unobserve(e.target);TQ.push(e.target);tpump()}}),{rootMargin:"200px"}):null;
function thumbs(root){(root||document).querySelectorAll(".oc[data-o]:not([data-th])").forEach(el=>{el.dataset.th="1";if(TOBS)TOBS.observe(el);else{TQ.push(el);tpump()}})}
function viewerHTML(id,y,art,c){return `<div class="vwrap"><div class="viewer" id="vw" style="--c:${c}"><span class="big">${esc(y||"o. J.")}</span><span>${esc(art||"")}</span><span id="vmsg">Digitalisat wird geladen …</span></div>
  <div class="vbar"><span id="vpage" class="note"></span><a href="https://www.digital.wienbibliothek.at/${id}" target="_blank" rel="noopener">Original auf digital.wienbibliothek.at öffnen ↗</a></div></div>`}
let OSDP=null;
function osd(){if(window.OpenSeadragon)return Promise.resolve();if(!OSDP)OSDP=new Promise((res,rej)=>{const s=document.createElement("script");
  s.src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s)});return OSDP}
function viewer(id){const box=document.getElementById("vw");if(!box)return;
  manifest(id).then(m=>{const cs=canvasesOf(m);const src=cs.map(c=>{try{return c.images[0].resource.service["@id"]+"/info.json"}catch(e){return null}}).filter(Boolean);
    if(!src.length){const v=document.getElementById("vmsg");if(v)v.textContent="Für dieses Objekt liefert die IIIF-Schnittstelle kein Bild.";return}
    return osd().then(()=>{if(!box.isConnected)return;box.innerHTML="";box.classList.add("osd");
      const v=OpenSeadragon({element:box,prefixUrl:"https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/",tileSources:src,sequenceMode:src.length>1,
        showReferenceStrip:src.length>1&&src.length<=80,referenceStripScroll:"horizontal",showNavigator:false,crossOriginPolicy:"Anonymous",showRotationControl:true});
      const pg=document.getElementById("vpage");const upd=p=>{if(pg)pg.textContent=src.length>1?`Seite ${p+1} von ${src.length}`:"1 Seite"};upd(0);v.addHandler("page",e=>upd(e.page))})})
   .catch(()=>{const v=document.getElementById("vmsg");if(v)v.textContent="Der Bildbetrachter konnte nicht geladen werden."})}

function stage(h){document.getElementById("stage").innerHTML=h;hideTip()}
function render(){if(!DATA)return;SHORT=DATA.order;const st=parseHash();crumbs(st);
  if(st.z||st.p){if(st.o)levelObj(st);else if(st.z)levelRow(st);else levelPerson(st)}
  else if(st.o)levelObj(st);
  else if(st.s!=null&&st.g!=null&&DATA.sp[st.s]&&(DATA.sp[st.s].kind==="calendar"||st.g>=1e7))dayPage(st);
  else if(st.s!=null&&st.g!=null&&DATA.sp[st.s]?.groups[st.g])level2(st.s,st.g);else if(st.s!=null&&DATA.sp[st.s])level1(st.s);else level0();
  scrollTo({top:0})}
function start(){
  if(window.PROTO_DATA){DATA=window.PROTO_DATA;render();return}
  fetch("data.json").then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{DATA=d;render()})
   .catch(e=>stage(`<p class="loading">Die Daten konnten nicht geladen werden (${esc(e.message)}). Liegt data.js im selben Ordner wie diese Datei?</p>`));
}
const ds=document.createElement("script");ds.src="data.js";ds.onload=start;ds.onerror=start;document.head.appendChild(ds);
</script>
